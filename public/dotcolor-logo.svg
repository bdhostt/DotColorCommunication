<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="100%" height="100%">
  <defs>
    <!-- Brand Orange Gradient -->
    <linearGradient id="dotOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- 4x4 Dot Matrix Icon with Large Orange Center Dot -->
  <g transform="translate(6, 6)">
    <!-- Row 1 -->
    <circle cx="8" cy="8" r="4.2" fill="#000000"/>
    <circle cx="25" cy="8" r="4.2" fill="#000000"/>
    <circle cx="42" cy="8" r="4.2" fill="#000000"/>
    <circle cx="59" cy="8" r="4.2" fill="#000000"/>

    <!-- Row 2 -->
    <circle cx="8" cy="25" r="4.2" fill="#000000"/>
    <circle cx="59" cy="25" r="4.2" fill="#000000"/>

    <!-- Center Big Orange Dot -->
    <circle cx="33.5" cy="33.5" r="14" fill="url(#dotOrange)"/>

    <!-- Row 3 -->
    <circle cx="8" cy="42" r="4.2" fill="#000000"/>
    <circle cx="59" cy="42" r="4.2" fill="#000000"/>

    <!-- Row 4 -->
    <circle cx="8" cy="59" r="4.2" fill="#000000"/>
    <circle cx="25" cy="59" r="4.2" fill="#000000"/>
    <circle cx="42" cy="59" r="4.2" fill="#000000"/>
    <circle cx="59" cy="59" r="4.2" fill="#000000"/>
  </g>

  <!-- Typography: DOT COLOR -->
  <g transform="translate(85, 4)">
    <!-- "DOT" -->
    <text x="0" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="2" fill="#000000">
      DOT
    </text>
    <!-- "COLOR" -->
    <text x="0" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="32" letter-spacing="3" fill="#FFFFFF" stroke="#EA580C" stroke-width="2.5" stroke-linejoin="round">
      COLOR
    </text>
  </g>

  <!-- "Communication" below icon and text -->
  <text x="6" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="27" letter-spacing="0.5" fill="#4B5563">
    Communication
  </text>
</svg>
