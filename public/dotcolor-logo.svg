<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 84" width="100%" height="100%">
  <defs>
    <!-- Brand Orange Gradient -->
    <linearGradient id="dotOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- 3x3 Dot Matrix Icon -->
  <g transform="translate(10, 8)">
    <!-- Row 1 -->
    <circle cx="12" cy="12" r="5" fill="#000000"/>
    <circle cx="34" cy="12" r="5" fill="#000000"/>
    <circle cx="56" cy="12" r="5" fill="#000000"/>

    <!-- Row 2 (Center dot is vibrant brand orange) -->
    <circle cx="12" cy="34" r="5" fill="#000000"/>
    <circle cx="34" cy="34" r="11" fill="url(#dotOrange)"/>
    <circle cx="56" cy="34" r="5" fill="#000000"/>

    <!-- Row 3 -->
    <circle cx="12" cy="56" r="5" fill="#000000"/>
    <circle cx="34" cy="56" r="5" fill="#000000"/>
    <circle cx="56" cy="56" r="5" fill="#000000"/>
  </g>

  <!-- Typography: DOT COLOR -->
  <g transform="translate(90, 8)">
    <!-- "DOT" -->
    <text x="0" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="36" letter-spacing="3" fill="#000000">
      DOT
    </text>
    <!-- "COLOR" -->
    <text x="0" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="32" letter-spacing="4" fill="url(#dotOrange)">
      COLOR
    </text>
  </g>
</svg>
