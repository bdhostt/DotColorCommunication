<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%">
  <defs>
    <!-- Vibrant Gradients for CMYK & Communication Theme -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0077FF"/>
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3399"/>
      <stop offset="100%" stop-color="#D9006C"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD200"/>
      <stop offset="100%" stop-color="#FF8800"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00A854"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Left Icon: Dynamic Dot Color Cluster & Communication Wave -->
  <g transform="translate(10, 10)" filter="url(#glow)">
    <!-- Central Hex/Aperture Dot Pattern -->
    <!-- Top Cyan Dot -->
    <circle cx="80" cy="40" r="22" fill="url(#cyanGrad)"/>
    <!-- Right Magenta Dot -->
    <circle cx="120" cy="78" r="22" fill="url(#magentaGrad)"/>
    <!-- Bottom Amber Dot -->
    <circle cx="95" cy="125" r="22" fill="url(#amberGrad)"/>
    <!-- Left Green Dot -->
    <circle cx="45" cy="115" r="20" fill="url(#emeraldGrad)"/>
    <!-- Upper Left Violet Dot -->
    <circle cx="38" cy="62" r="18" fill="#8B5CF6"/>
    <!-- Inner Core Dot -->
    <circle cx="80" cy="80" r="14" fill="#0F172A"/>
    <circle cx="80" cy="80" r="6" fill="#FFFFFF"/>

    <!-- Subtle Communication Arcs / Waves -->
    <path d="M 125,40 A 65 65 0 0 1 155,95" fill="none" stroke="#0077FF" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 138,25 A 85 85 0 0 1 175,100" fill="none" stroke="#FF3399" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M 152,10 A 105 105 0 0 1 195,108" fill="none" stroke="#FF8800" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Typography: DotColorCommunication -->
  <g transform="translate(210, 20)">
    <!-- "DotColor" -->
    <text x="0" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5">
      <tspan fill="#0F172A">Dot</tspan><tspan fill="url(#magentaGrad)">Color</tspan>
    </text>

    <!-- Small colorful accent dot next to DotColor -->
    <circle cx="282" cy="74" r="7" fill="#00D2FF"/>
    <circle cx="298" cy="74" r="7" fill="#FF8800"/>

    <!-- "COMMUNICATION" Subtitle with tracking -->
    <text x="3" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="22" letter-spacing="8" fill="#475569">
      COMMUNICATION
    </text>

    <!-- Pill Badge: Sales, POS & ERP -->
    <g transform="translate(325, 48)">
      <rect x="0" y="0" width="170" height="28" rx="14" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
      <text x="85" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" fill="#C2410C" text-anchor="middle" letter-spacing="0.8">
        SALES, POS &amp; ERP
      </text>
    </g>
  </g>
</svg>
